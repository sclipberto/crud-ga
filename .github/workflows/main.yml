name: build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: build de dockerfile
    runs-on: self-hosted

    steps:
      - name: quien es
        run: whoami

      - name: build server
        run: docker build -t crud-ga-server ./server
        
      - name: build client
        run: docker build -t crud-ga-client ./client

  deploy:
    name: deploy
    runs-on: self-hosted

    steps:
      - name: docker run
        run: docker compose up -d
        
    
