name: build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: build de dockerfile
    runs-on: self-hosted

    steps:
      - name: quien es
        uses: actions/checkout@v4
        run: |
          echo "ruta: $(pwd)"
          ls -la

      - name: build server
        uses: actions/checkout@v4
        run: docker build -t crud-ga-server ./server
        
      - name: build client
        uses: actions/checkout@v4
        run: docker build -t crud-ga-client ./client

  deploy:
    name: deploy
    runs-on: self-hosted

    steps:
      - name: docker run
        uses: actions/checkout@v4
        run: docker compose up -d
        
    
