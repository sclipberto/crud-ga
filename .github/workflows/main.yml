name: build and deploy
on:
  push:
    branches:
      - main
  workflow_dispatch: 

jobs:
  build:
    name: build de dockerfile
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: quien es
        run: |
          echo "ruta: $(pwd)"
          ls -la

      - name: build server
        run: docker build -t crud-ga-server ./server
        
      - name: archivo .env
        run: echo "B_URL=${{secrets.BASE_URL}}" > ./client/.env && echo "B_URL=${{secrets.BASE_URL}}"

      - name: build client
        run: docker build -t crud-ga-client ./client

  deploy:
    needs: build
    name: deploy
    runs-on: self-hosted

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: archivo .env
        run: echo "B_URL=${{secrets.BASE_URL}}" > .env && echo "B_URL=${{secrets.BASE_URL}}"

      - name: verificando
        run: cat .env

      - name: docker run
        run: docker compose up -d

      - name: quien es
        run: |
          echo "ruta: $(pwd)"
          ls -la
        
    
